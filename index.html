<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refactoring Advisor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">Refactoring <strong>Advisor</strong></span>
    </div>
    <div class="header-meta">
    <!--pan class="badge-course">15B17CI573 · Software Engineering Lab</span>-->
    </div>
  </header>

  <main class="app-layout">
    <!-- LEFT PANEL: Code Input -->
    <section class="panel panel-input">
      <div class="panel-header">
        <h2>Code Input</h2>
        <div class="lang-selector">
          <label for="language">Language</label>
          <select id="language">
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c">C</option>
          </select>
        </div>
      </div>

      <div class="code-input-area">
        <textarea
          id="codeInput"
          placeholder="Paste your source code here...&#10;&#10;Max 500 lines · Python / Java / C"
          spellcheck="false"
        ></textarea>
      </div>

      <div class="input-actions">
        <label class="upload-btn" for="fileUpload">
          <span>📂 Upload File</span>
          <input type="file" id="fileUpload" accept=".py,.java,.c" hidden />
        </label>
        <button class="btn-clear" id="clearBtn">Clear</button>
        <button class="btn-analyze" id="analyzeBtn">Analyze →</button>
      </div>

      <div class="input-meta" id="inputMeta">Ready · 0 lines</div>
    </section>

    <!-- RIGHT PANEL: Dashboard -->
    <section class="panel panel-results">
      <div class="results-header">
        <div class="score-ring" id="scoreRing">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="42" />
            <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="42"
              stroke-dasharray="0 264" />
          </svg>
          <div class="score-label">
            <span class="score-num" id="scoreNum">—</span>
            <span class="score-sub">Quality</span>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="metrics">Metrics</button>
          <button class="tab" data-tab="smells">Smells</button>
          <button class="tab" data-tab="suggestions">Suggestions</button>
          <button class="tab" data-tab="report">Report</button>
        </div>
      </div>

      <div class="tab-content" id="tabContent">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">⬡</div>
          <p>Paste code and click <strong>Analyze</strong> to begin.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/tokenizer.js"></script>
  <script src="js/halstead.js"></script>
  <script src="js/smellDetector.js"></script>
  <script src="js/refactorAdvisor.js"></script>
  <script src="js/scoreEngine.js"></script>
  <script src="js/reportGen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
